services:
  long-horizon-agent:
    build:
      context: ./services/long-horizon-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LHA_MODEL=gemini-3.7-flash
      - PORT=8000
    restart: unless-stopped

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - AGENT_A2A_URL=http://long-horizon-agent:8000/a2a
      - NEXT_PUBLIC_PORTAL_URL=http://localhost:3001
    depends_on:
      - long-horizon-agent
    restart: unless-stopped

  manager-portal:
    build:
      context: .
      dockerfile: apps/manager-portal/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - AGENT_A2A_URL=http://long-horizon-agent:8000/a2a
    depends_on:
      - long-horizon-agent
    restart: unless-stopped
